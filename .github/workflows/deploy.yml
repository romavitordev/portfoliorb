name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        # O Pages de projeto serve em /portfoliorb. Quando o dominio
        # proprio entrar, estas duas variaveis mudam aqui e mais nada:
        # BASE_PATH vira vazio e SITE_URL vira o dominio.
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /portfoliorb
          NEXT_PUBLIC_SITE_URL: https://romavitordev.github.io/portfoliorb

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
