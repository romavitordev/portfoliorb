<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* Os mesmos tokens do site. Se a paleta mudar em globals.css,
     troque aqui também — este arquivo é renderizado fora do Next. */
  :root {
    --primaria: 109 74 255;
    --secundaria: 45 139 255;
    --terciaria: 0 212 200;
    --quaternaria: 166 255 77;
    --fundo: 11 10 18;
    --texto: 236 234 245;
    --texto-suave: 148 144 171;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: rgb(var(--fundo));
    color: rgb(var(--texto));
    font-family: Inter, system-ui, sans-serif;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 72px;
  }
  /* Campos de luz — o mesmo motivo do fundo do site */
  .campo { position: absolute; border-radius: 9999px; filter: blur(90px); pointer-events: none; }
  /* O degradê some em 100%, não em 70%: parando antes, o blur revela a
     borda do círculo e o campo lê como mancha em vez de luz. Os círculos
     também são maiores que a área que ocupam, pra borda cair fora do
     quadro. */
  .c1 { width: 900px; height: 900px; left: -340px; top: -420px;
        background: radial-gradient(closest-side, rgb(var(--primaria) / .38), transparent 100%); }
  .c2 { width: 760px; height: 760px; right: -300px; bottom: -360px;
        background: radial-gradient(closest-side, rgb(var(--terciaria) / .26), transparent 100%); }

  .topo { position: relative; display: flex; align-items: center; gap: 18px; }
  .rotulo { font-family: 'JetBrains Mono', monospace; font-size: 17px;
            letter-spacing: .28em; text-transform: uppercase; color: rgb(var(--terciaria)); }
  .regua { flex: 1; height: 1px;
           background: linear-gradient(90deg, rgb(var(--terciaria) / .5), rgb(var(--primaria) / .35) 45%, transparent); }

  .meio { position: relative; }
  h1 { font-family: 'Instrument Serif', Georgia, serif; font-size: 92px;
       line-height: 1.02; letter-spacing: -.02em; }
  .amp { color: rgb(var(--terciaria)); }
  p { margin-top: 26px; font-size: 27px; line-height: 1.45;
      color: rgb(var(--texto-suave)); max-width: 860px; }

  .base { position: relative; display: flex; align-items: flex-end;
          justify-content: space-between; gap: 40px; }
  .escala { display: flex; gap: 7px; align-items: flex-end; }
  .escala i { display: block; width: 54px; border-radius: 3px; }
  .local { font-family: 'JetBrains Mono', monospace; font-size: 16px;
           letter-spacing: .16em; text-transform: uppercase; color: rgb(var(--texto-suave)); }
</style>
</head>
<body>
  <div class="campo c1"></div>
  <div class="campo c2"></div>

  <div class="topo">
    <span class="rotulo">Estúdio de desenvolvimento</span>
    <span class="regua"></span>
  </div>

  <div class="meio">
    <h1>Roma <span class="amp">&amp;</span> Buganza</h1>
    <p>Sites, landing pages e sistemas sob medida — do primeiro rabisco ao deploy.</p>
  </div>

  <div class="base">
    <span class="local">Sorocaba/SP · desde 2024</span>
    <!-- A escala sobe: a mesma progressão que ordena o site inteiro -->
    <span class="escala">
      <i style="height:14px;background:rgb(var(--primaria))"></i>
      <i style="height:24px;background:rgb(var(--secundaria))"></i>
      <i style="height:38px;background:rgb(var(--terciaria))"></i>
      <i style="height:56px;background:rgb(var(--quaternaria))"></i>
    </span>
  </div>
</body>
</html>
